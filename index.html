<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imports Arthur - iPhones Originais com Garantia</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', sans-serif;scroll-behavior:smooth;}
    body{color:#fff; overflow-x:hidden;}
    #video-bg {position: fixed;top: 0;left: 0;width: 100%;height: 100%;object-fit: cover;z-index: -2;}
   .overlay {position: fixed;top: 0;left: 0;width: 100%;height: 100%;background: rgba(0,0,0,0.4);z-index: -1;}
    header{text-align: center;padding: 80px 20px 40px 20px;background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent);}
   .logo-text {
        font-size: 4rem;
        font-weight: 900;
        color: #0c0c0c;
        text-shadow: 0 2px 20px rgba(0,0,0,0.8), 0 0 30px rgba(243, 243, 248, 0.8);
        display: inline-flex;
        align-items: center;
        gap: 15px;
        letter-spacing: 4px;
        margin-bottom: 25px;
    }
   .apple-icon {width: 50px;height: 50px;fill: #eff7ef;}
   .frase-destaque {
        font-size: 1.8rem;
        font-weight: 700;
        color: #030303;
        text-shadow: 0 2px 15px rgba(0,0,0,0.8), 0 0 20px rgba(247, 246, 241, 0.6);
        letter-spacing: 2px;
    }
   .produtos-section{max-width: 1200px;margin: 60px auto;padding: 40px 20px;text-align: center;background: rgba(0,0,0,0.2);border-radius: 20px;backdrop-filter: blur(8px);box-shadow: 0 8px 30px rgba(0,0,0,0.3);}
   .produtos-section h2{color:#f0efee; font-size: 2rem; margin-bottom: 20px;}
   .grid-pronta{display:grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 20px 10px;}
    @media(max-width: 600px){.grid-pronta{grid-template-columns: 1fr;} }
   .grid-encomenda{display:grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 20px 10px;}
    @media(max-width: 600px){.grid-encomenda{grid-template-columns: 1fr;} }
   .aviso-encomenda{background:rgba(255,215,0,0.08);border:1px solid #f7e707;padding:15px;border-radius:12px;margin-bottom:25px;font-weight:600;}
    /* AVISO SUTIL DE SITE DESATIVADO */
   .aviso-desativado{background: rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); padding:10px 15px; border-radius:20px; margin:0 auto 30px auto; max-width:500px; font-size:0.9rem; color:#eee; backdrop-filter: blur(5px);}
   .card-produto{background: rgba(0,0,0,0.35);border-radius: 20px;overflow: hidden;box-shadow: 0 8px 25px rgba(0,0,0,0.4);transition: 0.3s;border: 1px solid rgba(255,215,0,0.2);backdrop-filter: blur(10px);text-align: left;}
   .card-produto:hover{transform: translateY(-10px);box-shadow: 0 15px 40px rgba(255,215,0,0.3);border-color: #FFD700;}
   .card-produto img{width: 100%;height: 220px;object-fit: contain;background: rgba(0,0,0,0.3);padding: 15px;display: block;}
   .card-conteudo{padding: 20px;}
   .card-produto h3{color: #f7f6f4; font-size: 1.5rem; margin-bottom: 8px;}
   .card-produto p{color: #ddd; margin-bottom: 15px; font-size: 14px; min-height: 40px;}
   .preco{font-size: 26px;font-weight:bold;margin:10px 0;color:#fff;}
   .sinal{font-size: 16px;color:#ffee00;font-weight:600;margin-bottom:10px;}
    /* BOTÃO AGORA DESATIVADO - SÓ VISUAL */
   .btn-comprar{display: inline-block;padding: 12px 20px;background: #ffd900;color: #000;text-decoration: none;border-radius: 25px;font-weight: bold;font-size: 1rem;transition: 0.3s;width: 100%;text-align: center;border: none;cursor: default; opacity:0.6;}
    footer{text-align: center; padding: 25px; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);}
   .rodape{color:#fff;}
   .rodape a{color:#25D366;font-weight:700;text-decoration:none;transition:0.3s;}
   .rodape a:hover{text-decoration:underline;text-shadow:0 0 10px #25D366;}
    @media(max-width: 768px){
    .logo-text{font-size: 2.5rem; letter-spacing: 2px;}
    .apple-icon{width: 35px; height: 35px;}
    .frase-destaque{font-size: 1.3rem; padding: 0 15px;}
    }
</style>
</head>
<body>
<video autoplay muted loop playsinline id="video-bg">
    <source src="estatua.mp4" type="video/mp4">
</video>
<div class="overlay"></div>
<header>
    <h1 class="logo-text">
        Imports Arthur
        <svg class="apple-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1-52.6 16.4-67.9 34-15.8 17.7-29.7 46.3-25 72.1 29.2 2.3 49.7-32.8 68.9-33.6z"/></svg>
    </h1>
    <p class="frase-destaque">Seu próximo iPhone está aqui!</p>
</header>
<section class="produtos-section">
    <div class="aviso-desativado">ℹ️ Site em modo demonstração - temporariamente sem botões de contato ativos</div>
    <div>
        <h2>🔥 Pronta Entrega</h2>
        <div class="grid-pronta" id="lista-pronta"><div class="loading">Carregando...</div></div>
    </div>
    <div style="margin-top: 60px;">
        <h2>Encomenda</h2>
        <div class="aviso-encomenda">⚠️ Encomenda mediante sinal de 30% do valor do produto</div>
        <div class="grid-encomenda" id="lista-encomenda"><div class="loading">Carregando...</div></div>
    </div>
</section>

<footer>
    <div class="rodape">Desenvolvido por <a href="https://wa.me/5551985108885?text=Ol%C3%A1%20Edmilson%2C%20Vim%20pelo%20site%20do%20Imports%20Arthur%20e%20gostaria%20de%20um%20or%C3%A7amento." target="_blank">Edmilson Bittencourt</a></div>
</footer>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQJNROg5_zMaA2tjMYW_8hr7K-ufdX3TVXQS_61nCkMAmr9-Ir01EyHOcX5m2h3haZL-XkotesF0Brj/pub?output=csv";

function converterLinkDrive(link) {
  if(!link) return "";
  link = link.replace(/"/g, '').trim();
  if(link.includes('thumbnail') || link.includes('imgur') || link.includes('.jpg') || link.includes('.png')) return link;
  const match = link.match(/\/d\/([a-zA-Z0-9-_]+)/);
  if (match && match[1]) return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
  return link;
}
function formatarPreco(valor) {
    return parseFloat(valor.toString().replace(/[^0-9,]/g, '').replace(',', '.')) || 0;
}
function parseCSV(text) {
  const rows = []; let row = [], cell = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const char = text[i], next = text[i+1];
    if (char === '"') { if (inQuotes && next === '"') { cell += '"'; i++; } else { inQuotes =!inQuotes; } }
    else if (char === ',' &&!inQuotes) { row.push(cell); cell = ''; }
    else if ((char === '\n' || char === '\r') &&!inQuotes) {
      if (cell!== '' || row.length > 0) { row.push(cell); rows.push(row); row = []; cell = ''; }
      if (char === '\r' && next === '\n') i++;
    } else { cell += char; }
  }
  if (cell!== '' || row.length > 0) { row.push(cell); rows.push(row); }
  const headers = rows[0];
  return rows.slice(1).map(r => Object.fromEntries(headers.map((h, i) => [h.trim(), r[i]?.trim() || ''])));
}
function criarCard(produto) {
    const nome = produto['Modelo'];
    const precoNum = formatarPreco(produto['Valor']);
    const preco = precoNum.toLocaleString('pt-BR', {minimumFractionDigits: 2});
    const sinal = (precoNum * 0.3).toLocaleString('pt-BR', {minimumFractionDigits: 2});
    const img = converterLinkDrive(produto['Link da foto']);
    const desc = produto['Especificações'] || 'iPhone Original com Garantia';
    const disponibilidade = produto['Disponibilidade'];
    return `
        <div class="card-produto">
            <img src="${img}" alt="${nome}" onerror="this.src='https://via.placeholder.com/400x220/000/FFD700?text=${encodeURIComponent(nome)}'">
            <div class="card-conteudo">
                <h3>${nome}</h3>
                <p>${desc}</p>
                <div class="preco">R$ ${preco}</div>
                ${disponibilidade === 'Encomenda'? `<div class="sinal">Sinal 30%: R$ ${sinal}</div>` : ''}
                <button class="btn-comprar" disabled>Comprar no Whats</button>
            </div>
        </div>
    `;
}
async function carregarProdutos() {
    const containerPronta = document.getElementById('lista-pronta');
    const containerEncomenda = document.getElementById('lista-encomenda');
    containerPronta.innerHTML = ''; containerEncomenda.innerHTML = '';
    try {
        const res = await fetch(CSV_URL);
        const data = await res.text();
        const dados = parseCSV(data).filter(p => p['Modelo']);
        let temPronta = false; let temEncomenda = false;
        dados.forEach(produto => {
            const disponibilidade = produto['Disponibilidade'];
            if(disponibilidade === 'Pronta Entrega'){ containerPronta.innerHTML += criarCard(produto); temPronta = true; }
            else if(disponibilidade === 'Encomenda'){ containerEncomenda.innerHTML += criarCard(produto); temEncomenda = true; }
        });
        if(!temPronta) containerPronta.innerHTML = `<p style="color:#FFD700; width:100%;">Nenhum produto em Pronta Entrega</p>`
        if(!temEncomenda) containerEncomenda.innerHTML = `<p style="color:#FFD700; width:100%;">Nenhum produto em Encomenda</p>`
    } catch (erro) {
        containerPronta.innerHTML = '<p style="color:red;">Erro ao carregar CSV</p>';
        containerEncomenda.innerHTML = '<p style="color:red;">Erro ao carregar CSV</p>';
    }
}
carregarProdutos();
</script>
</body>
</html>
